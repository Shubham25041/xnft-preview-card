<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0d192b" />
    <meta
      name="description"
      content="NFT preview card for Equilibrium #3429."
    />
    <title>Equilibrium #3429 | NFT Preview Card</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="page-shell">
      <main class="card" aria-labelledby="card-title">
        <div class="card__images">
          <picture class="card__image-picture">
            <img
              class="card__product-image"
              src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSAwVENMRyYwDAj5m0tk4Uitz0tjapKZRgrj1hNOzGi-1ffXIV0olTe6_CZ&s=10"
              data-fallback="https://raw.githubusercontent.com/ImPimms/Frontend-Mentor-NFT-preview-card/main/images/image-equilibrium.jpg"
              alt="A glowing geometric equilibrium NFT artwork"
              width="604"
              height="604"
            />
          </picture>
          <div class="card__images-layer" aria-hidden="true">
            <svg viewBox="0 0 48 48" width="48" height="48" focusable="false" aria-hidden="true">
              <path
                d="M2 24S10 9 24 9s22 15 22 15-8 15-22 15S2 24 2 24Z"
                fill="none"
                stroke="#fff"
                stroke-width="3"
                stroke-linejoin="round"
              />
              <circle cx="24" cy="24" r="7" fill="none" stroke="#fff" stroke-width="3" />
            </svg>
          </div>
        </div>

        <div class="card__title">
          <h1 id="card-title">Equilibrium #3429</h1>
        </div>
        <p class="card__description" id="info">Our Equilibrium collection promotes balance and calm.</p>

        <div class="card__time" aria-label="Sale details">
          <div class="card__time-left">
            <svg class="card__icon card__icon--ethereum" viewBox="0 0 11 18" width="11" height="18" aria-hidden="true" focusable="false">
              <path d="M5.5 0 0 9.1l5.5 3.3L11 9.1 5.5 0Z" fill="currentColor" />
              <path d="M0 10.2 5.5 18l5.5-7.8-5.5 3.3L0 10.2Z" fill="currentColor" />
            </svg>
            <span class="card__price">0.041 ETH</span>
          </div>
          <div class="card__time-right">
            <svg class="card__icon card__icon--clock" viewBox="0 0 17 17" width="17" height="17" aria-hidden="true" focusable="false">
              <circle cx="8.5" cy="8.5" r="6.8" fill="none" stroke="currentColor" stroke-width="1.6" />
              <path d="M8.5 4.3v4.4l3 1.8" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
            <span>3 days left</span>
          </div>
        </div>

        <div class="card__creator">
          <picture class="card__creator-picture">
            <img
              class="card__creator-image"
              src="./images/image-avatar.png"
              data-fallback="https://raw.githubusercontent.com/ImPimms/Frontend-Mentor-NFT-preview-card/main/images/image-avatar.png"
              alt="Portrait of NFT creator Jules Wyvern"
              width="66"
              height="66"
            />
          </picture>
          <p class="card__creator-text">
            <span class="card__creator-label">Creation of.</span>
            <span class="card__creator-name">Ketan Makode</span>
          </p>
        </div>
      </main>

      <footer class="attribution">
        Challenge by
        <a href="https://www.crio.do" target="_blank" rel="noopener noreferrer">Crio</a>.
        Built by
        <a href="https://www.github.com/imketan1610" target="_blank" rel="noopener noreferrer">Ketan Makode</a>.
      </footer>
    </div>
  </body>
</html>
